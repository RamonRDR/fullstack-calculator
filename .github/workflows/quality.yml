name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run backend tests with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: Show backend coverage
        run: go tool cover -func=coverage.out
      - name: Build backend
        run: go build ./cmd/server

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Run frontend coverage
        run: npm run coverage
      - name: Build frontend
        run: npm run build

  integration:
    name: Development smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Start development servers and verify integration
        shell: bash
        run: |
          set -euo pipefail

          (cd backend && go run ./cmd/server) > /tmp/calculator-backend.log 2>&1 &
          backend_pid=$!
          (cd frontend && npm run dev -- --host 127.0.0.1) > /tmp/calculator-frontend.log 2>&1 &
          frontend_pid=$!

          cleanup() {
            kill "$backend_pid" "$frontend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          backend_ready=false
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:8080/api/calculate \
              -H 'Content-Type: application/json' \
              -d '{"operation":"multiply","a":6,"b":7}' | grep -q '"result":42'; then
              backend_ready=true
              break
            fi
            sleep 0.5
          done

          if [[ "$backend_ready" != "true" ]]; then
            cat /tmp/calculator-backend.log
            exit 1
          fi

          frontend_ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              frontend_ready=true
              break
            fi
            sleep 0.5
          done

          if [[ "$frontend_ready" != "true" ]]; then
            cat /tmp/calculator-frontend.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:5173/api/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"multiply","a":6,"b":7}' | grep -q '"result":42'
